<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AAC Halloween Drop — Spooky Upload Edition</title>

<!-- Cartoon font -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

<!--
  AAC Halloween Drop — Spooky Upload Edition
  --------------------------------------------------
  Required files to place in same folder as this HTML:
  Images:
    - spooky1.png ... spooky14.png  (fallback default Halloween drop images)
    - witch.png                      (flying witch / spooky flyer image)
    - spiderweb.png                  (spiderweb / chute image)
    - witch_avatar.png              (player 1 avatar - pumpkin / witch)
    - ghost_avatar.png              (player 2 avatar - ghost / monster)

  Audio:
    - spooky_bg.mp3                  (background music)
    - click.mp3
    - drop.mp3
    - fireworks.mp3

  Save as: aac_halloween_drop.html
  Open in Chrome for best experience. Fullscreen is requested automatically on Start button click.
-->

<style>
  :root{ --p1:#ff6600; --p2:#00ff66; --title-outline:#2a0845; }
  html,body{height:100%;margin:0;background:linear-gradient(180deg, #0b0712 0%, #1c0e33 50%, #3b154c 100%);font-family:Arial, Helvetica, sans-serif;overflow:hidden}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;display:block}

  /* Top bar layout: left score - title - right score */
  #topBar{ position:absolute; top:12px; left:0; right:0; height:88px; z-index:80; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .score-side{ width:250px; display:flex; justify-content:center; pointer-events:auto; align-items:center; }
  .score-box{ display:inline-flex; align-items:center; gap:10px; user-select:none; margin:0 6px; padding:8px 14px; border-radius:12px; font-size:18px; font-weight:800; color:#fff;
              background:linear-gradient(120deg,#2d124d,#4a157d); border:2px solid #ff9900; box-shadow:0 0 15px rgba(255,102,0,0.4); cursor:pointer; }
  #titleWrap{ pointer-events:none; text-align:center; width:560px; }
  #title{
    font-family:'Bangers', cursive;
    font-size:64px;
    color:#ff9900;
    -webkit-text-stroke: 1.8px var(--title-outline);
    text-stroke: 1.8px var(--title-outline);
    text-shadow: 0 0 20px rgba(255,102,0,0.8), 0 6px 18px rgba(0,0,0,0.8);
    line-height:1;
    margin:0;
    letter-spacing:1px;
  }

  /* avatar styles: small circular portraits */
  .avatar {
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    flex:0 0 44px;
    display:inline-block;
    box-shadow: 0 0 10px rgba(0,255,102,0.5);
    border: 3px solid rgba(255,255,255,0.8);
    transition: box-shadow 180ms ease, transform 180ms ease;
    background: #110022;
  }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  .nameSpan{ font-weight:900; margin-right:4px; display:inline-block; vertical-align:middle; text-shadow:0 2px 4px #000; }
  .scoreSpan{ font-weight:900; display:inline-block; vertical-align:middle; min-width:36px; text-align:right; color:#00ff66; text-shadow:0 0 8px #00ff66; }

  .pulse{ animation:pulseAnim 520ms ease-out; }
  @keyframes pulseAnim { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

  /* Winner banner */
  #winnerBanner{ position:absolute; left:50%; top:16%; transform:translate(-50%,-50%); z-index:85; padding:12px 28px; border-radius:18px; font-size:36px; font-weight:900; color:white; display:none; text-shadow:0 8px 20px rgba(0,0,0,0.8); border:3px solid #00ff66; }

  /* overlays (start & play again) */
  .overlay {
    position:absolute; left:0; top:0; width:100%; height:100%; background:rgba(10,5,20,0.85); z-index:200;
    display:flex; align-items:center; justify-content:center;
  }
  .card {
    width:640px; max-width:94%; border-radius:16px; padding:22px 28px;
    background:linear-gradient(180deg, rgba(40,15,65,0.95), rgba(20,5,35,0.95));
    border:2px solid #ff6600;
    box-shadow:0 0 30px rgba(255,102,0,0.3), 0 20px 60px rgba(0,0,0,0.8); color:white; text-align:center; backdrop-filter:blur(8px);
  }
  .card h1 { margin:0 0 12px 0; font-size:28px; color:#ff9900; text-shadow:0 0 10px rgba(255,153,0,0.6); font-family:'Bangers', cursive; letter-spacing:1px; }
  .nameRow{ display:flex; gap:12px; justify-content:center; margin:12px 0 14px 0; }
  .nameRow input{ width:48%; padding:12px 14px; border-radius:10px; border:1px solid #a855f7; outline:none; font-size:18px; box-shadow:inset 0 2px 8px rgba(0,0,0,0.6); background:rgba(255,255,255,0.95); color:#111; font-weight:bold; }

  /* Upload area */
  .uploadRow{ display:flex; gap:12px; align-items:center; justify-content:center; margin:12px 0 4px 0; flex-wrap:wrap; }
  .uploadLabel{ font-size:15px; color:#00ff66; opacity:0.95; font-weight:bold; }
  #fileInput{ display:inline-block; color:#fff; }
  #uploadInfo{ font-size:13px; color:#d8b4fe; opacity:0.95; margin-top:6px; }

  #startBtn{ margin-top:14px; padding:12px 32px; font-size:24px; font-weight:800; border-radius:12px; border:none; background:linear-gradient(180deg,#ff9900,#cc4400); color:#fff; cursor:pointer; box-shadow:0 0 20px rgba(255,102,0,0.6); text-shadow:0 2px 4px #000; font-family:'Bangers', cursive; }
  #startBtn:hover { transform: translateY(-3px) scale(1.03); }

  .playAgainButtons { display:flex; gap:16px; justify-content:center; margin-top:14px; }
  .playBtn { padding:10px 24px; border-radius:10px; border:none; font-size:20px; font-weight:800; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,0.5); font-family:'Bangers', cursive; }
  .yesBtn { background:linear-gradient(180deg,#00ff66,#009933); color:#002b0c; }
  .noBtn { background:linear-gradient(180deg,#ff6600,#cc3300); color:#330a00; }

  /* Next Drop button */
  #nextBtn{
    position:absolute;
    left:50%;
    top:60%;
    transform:translate(-50%,-50%);
    z-index:90;
    padding:26px 58px;
    font-size:38px;
    font-family:'Bangers', cursive;
    letter-spacing:1px;
    border-radius:16px;
    border:2px solid #00ff66;
    background:linear-gradient(180deg,#a855f7,#6b21a8);
    color:white;
    cursor:pointer;
    box-shadow:0 0 25px rgba(168,85,247,0.7), 0 10px 26px rgba(0,0,0,0.6);
    display:none;
    pointer-events:auto;
    text-shadow:0 3px 6px #000;
  }
  #nextBtn:hover { transform:translate(-50%,-53%) scale(1.04); }

  @media (max-width:700px){
    #title{ font-size:38px; }
    .score-side{ width:40%; }
    .avatar{ width:36px; height:36px; }
  }
</style>
</head>
<body>

<!-- Canvas -->
<canvas id="game"></canvas>

<!-- Top bar: left score - centered title - right score -->
<div id="topBar">
  <div id="leftScore" class="score-side" style="pointer-events:auto;">
    <div id="p1" class="score-box" role="button" aria-pressed="false">
      <span class="avatar" id="p1avatar"><img src="images/witch_avatar.png" alt="P1 avatar" /></span>
      <span class="nameSpan" id="p1name">Pumpkin 1</span>
      <span class="scoreSpan" id="p1score">0</span>
    </div>
  </div>

  <div id="titleWrap">
    <h1 id="title">🎃 AAC Spooky Drop 👻</h1>
  </div>

  <div id="rightScore" class="score-side" style="pointer-events:auto;">
    <div id="p2" class="score-box" role="button" aria-pressed="false">
      <span class="avatar" id="p2avatar"><img src="images/ghost_avatar.png" alt="P2 avatar" /></span>
      <span class="nameSpan" id="p2name">Ghost 2</span>
      <span class="scoreSpan" id="p2score">0</span>
    </div>
  </div>
</div>

<!-- Winner banner -->
<div id="winnerBanner"></div>

<!-- Next Drop button -->
<button id="nextBtn">🎃 Next Drop 🦇</button>

<!-- Start overlay (name entry + upload) -->
<div id="startOverlay" class="overlay" aria-hidden="false">
  <div id="startCard" class="card" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <h1 id="startTitle">🧙‍♀️ Enter Spooky Player Names! 🎃</h1>
    <div class="nameRow">
      <input id="name1" placeholder="Player 1 (Pumpkin Orange)" maxlength="20" />
      <input id="name2" placeholder="Player 2 (Slime Green)" maxlength="20" />
    </div>

    <div class="uploadRow" aria-hidden="false">
      <label class="uploadLabel">Upload Halloween Drop Images (PNG / JPG):</label>
      <input id="fileInput" type="file" accept=".png,.jpg,.jpeg" multiple />
    </div>
    <div id="uploadInfo">No custom images selected — game will use default spooky set.</div>

    <button id="startBtn">Start Spooky Game</button>
  </div>
</div>

<!-- Play Again overlay -->
<div id="playAgainOverlay" class="overlay" style="display:none" aria-hidden="true">
  <div id="playAgainCard" class="card">
    <h1>👻 Play Again? 🎃</h1>
    <div class="playAgainButtons">
      <button id="playYes" class="playBtn yesBtn">Yes!</button>
      <button id="playNo" class="playBtn noBtn">No</button>
    </div>
  </div>
</div>

<!-- audio elements -->
<audio id="bgAudio" src="sounds/spooky_bg.mp3" loop></audio>
<audio id="clickAudio" src="sounds/click.mp3"></audio>
<audio id="dropAudio" src="sounds/drop.mp3"></audio>
<audio id="fireAudio" src="sounds/fireworks.mp3"></audio>

<script>
/* =========================
   AAC Halloween Drop
   - Custom spooky theme with night sky, full moon & glowing fog
   - Background music support (spooky_bg.mp3)
   - Accepts PNG/JPG uploads in Start popup
   ========================= */

/* -------- CONFIG & ASSETS -------- */
const DEFAULT_DROP_FILENAMES = [
  'images/spooky1.png','images/spooky2.png','images/spooky3.png','images/spooky4.png','images/spooky5.png','images/spooky6.png','images/spooky7.png',
  'images/spooky8.png','images/spooky9.png','images/spooky10.png','images/spooky11.png','images/spooky12.png','images/spooky13.png','images/spooky14.png'
];
const FLYER_SRC = "images/witch.png";          // Replaces airplane (Witch on broomstick)
const CARRIER_SRC = "images/spiderweb.png";    // Replaces parachute (Spiderweb / Chute)
const MAX_UPLOADS = 30;
const ALLOWED_TYPES = ['image/png','image/jpeg'];

/* Spooky visual constants */
const PLAYER1_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--p1').trim() || '#ff6600';
const PLAYER2_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--p2').trim() || '#00ff66';
const FALL_SIZE = 130;

/* -------- CANVAS -------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* -------- IMAGE LOADING -------- */
let defaultDropImgs = DEFAULT_DROP_FILENAMES.map(fn => { const img = new Image(); img.src = fn; return img; });
let uploadedImgs = [];

function getActiveDropPool(){
  return uploadedImgs.length > 0 ? uploadedImgs.map(o => o.img) : defaultDropImgs;
}

const planeImg = new Image(); planeImg.src = FLYER_SRC;
const parachuteImg = new Image(); parachuteImg.src = CARRIER_SRC;

/* -------- AUDIO -------- */
const bgAudio = document.getElementById('bgAudio'); bgAudio.volume = 0.15; // Low volume for spooky ambience
const clickAudio = document.getElementById('clickAudio'); clickAudio.volume = 0.3;
const dropAudio = document.getElementById('dropAudio');
const fireAudio = document.getElementById('fireAudio');

function playSound(elem, vol = 1){
  if(!elem) return;
  try { elem.pause(); elem.currentTime = 0; elem.volume = vol; elem.play().catch(()=>{}); } catch(e){}
}

/* -------- STATE -------- */
let plane = { x: 280, y: 160, w: 280, h: 180, vx: 2.2 };
let activeDrop = null;
let isRunning = false;
let gameOver = false;
let score1 = 0, score2 = 0;
let playerName1 = "Pumpkin 1", playerName2 = "Ghost 2";

/* DOM refs */
const p1Box = document.getElementById('p1');
const p2Box = document.getElementById('p2');
const p1nameSpan = document.getElementById('p1name');
const p2nameSpan = document.getElementById('p2name');
const p1scoreSpan = document.getElementById('p1score');
const p2scoreSpan = document.getElementById('p2score');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const name1Input = document.getElementById('name1');
const name2Input = document.getElementById('name2');
const fileInput = document.getElementById('fileInput');
const uploadInfo = document.getElementById('uploadInfo');
const winnerBanner = document.getElementById('winnerBanner');
const nextBtn = document.getElementById('nextBtn');
const playAgainOverlay = document.getElementById('playAgainOverlay');
const playYes = document.getElementById('playYes');
const playNo = document.getElementById('playNo');

/* -------- Spooky Moon & Mist -------- */
function drawMoon(){
  ctx.save();
  const moonX = canvas.width * 0.82;
  const moonY = 130;
  const moonRadius = 65;

  // Glowing halo
  const glow = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.5, moonX, moonY, moonRadius * 2.8);
  glow.addColorStop(0, 'rgba(255, 235, 170, 0.85)');
  glow.addColorStop(0.35, 'rgba(255, 180, 80, 0.25)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonRadius * 2.8, 0, Math.PI * 2);
  ctx.fill();

  // Moon surface
  ctx.fillStyle = '#fffbe6';
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
  ctx.fill();

  // Moon craters
  ctx.fillStyle = 'rgba(200, 180, 130, 0.28)';
  ctx.beginPath(); ctx.arc(moonX - 18, moonY - 12, 14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX + 22, moonY + 16, 20, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX - 6, moonY + 28, 10, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

let clouds = [];
function spawnClouds(){
  clouds = [];
  for(let i=0;i<5;i++){
    clouds.push({
      x: Math.random()*canvas.width,
      y: 50 + Math.random()*140,
      w: 240 + Math.random()*180,
      h: 50 + Math.random()*40,
      vx: (0.15 + Math.random()*0.4) * (Math.random()<0.5?-1:1)
    });
  }
}
spawnClouds();

let contrails = []; // Witch magic sparkles

/* -------- Spooky Graveyard Ground -------- */
function drawGrassBase(){
  const h = canvas.height;
  const grassTop = h - 90;

  // Dark ground shadow
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(canvas.width/2, grassTop + 26, canvas.width*0.52, 38, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Spooky dark hill base
  ctx.save();
  const grad = ctx.createLinearGradient(0, grassTop, 0, h);
  grad.addColorStop(0, '#1c311f');
  grad.addColorStop(1, '#09140a');
  ctx.fillStyle = grad;
  ctx.beginPath();
  const waveH = 24;
  ctx.moveTo(0, grassTop + waveH);
  const segments = 12;
  for(let i=0;i<=segments;i++){
    const x = (i/segments)*canvas.width;
    const nx = x + (canvas.width/segments)/2;
    const y = grassTop + Math.sin((i/segments)*Math.PI*2)*16;
    ctx.quadraticCurveTo(nx, y, x + (canvas.width/segments), grassTop + waveH);
  }
  ctx.lineTo(canvas.width, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Eerie slime green top highlight
  ctx.save();
  const grad2 = ctx.createLinearGradient(0, grassTop, 0, grassTop + 45);
  grad2.addColorStop(0, '#00ff66');
  grad2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad2;
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.moveTo(0, grassTop + 8);
  for(let i=0;i<=segments;i++){
    const x = (i/segments)*canvas.width;
    const nx = x + (canvas.width/segments)/2;
    const y = grassTop + 8 + Math.sin((i/segments)*Math.PI*2)*8;
    ctx.quadraticCurveTo(nx, y, x + (canvas.width/segments), grassTop + 8);
  }
  ctx.lineTo(canvas.width, grassTop + 45);
  ctx.lineTo(0, grassTop + 45);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* -------- Halloween Fireworks / Magic Bursts -------- */
let fireworksParticles = [];
function createFireworkBurst(x,y,amount=100){
  const halloweenColors = ['#ff6600', '#00ff66', '#a855f7', '#ffff00', '#ff0055'];
  for(let i=0;i<amount;i++){
    fireworksParticles.push({
      x,y,
      angle: Math.random()*Math.PI*2,
      speed: 1.7 + Math.random()*4,
      radius: 1.5 + Math.random()*3.5,
      color: halloweenColors[Math.floor(Math.random()*halloweenColors.length)],
      life: 120 + Math.floor(Math.random()*240)
    });
  }
  playSound(fireAudio, 0.9);
}
function drawFireworks(){
  for(let i=fireworksParticles.length-1;i>=0;i--){
    const p = fireworksParticles[i];
    p.x += Math.cos(p.angle)*p.speed;
    p.y += Math.sin(p.angle)*p.speed + 0.12*(1 - p.life/360);
    p.speed *= 0.995;
    p.life--;
    ctx.globalAlpha = Math.max(p.life/240, 0);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    if(p.life <= 0) fireworksParticles.splice(i,1);
  }
}

/* -------- Helpers -------- */
function hexToRgba(hex, alpha){ 
  const h = hex.replace('#',''); 
  const r = parseInt(h.substring(0,2),16); 
  const g = parseInt(h.substring(2,4),16); 
  const b = parseInt(h.substring(4,6),16); 
  return `rgba(${r},${g},${b},${alpha})`; 
}

/* -------- Draw fog & witch magic dust -------- */
function drawCloud(c){
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#4a2366';
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.w*0.48, c.h*0.55, 0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(c.x - c.w*0.2, c.y + c.h*0.08, c.w*0.25, c.h*0.45, 0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(c.x + c.w*0.2, c.y + c.h*0.08, c.w*0.25, c.h*0.45, 0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function updateClouds(){ 
  for(const c of clouds){ 
    c.x += c.vx; 
    if(c.x - c.w > canvas.width) c.x = -50; 
    if(c.x + c.w < 0) c.x = canvas.width + 50; 
  } 
}

/* Witch magic sparkle trail */
function drawContrails(){
  if(Math.random() < 0.25) {
    contrails.push({ 
      x: plane.x + (plane.vx > 0 ? -plane.w*0.3 : plane.w*0.3), 
      y: plane.y + (Math.random()*24 - 12), 
      size: 3 + Math.random()*6, 
      alpha: 0.9,
      color: ['#ff9900','#00ff66','#a855f7','#ffff00'][Math.floor(Math.random()*4)]
    });
  }
  for(let i=contrails.length-1;i>=0;i--){
    const t = contrails[i];
    ctx.save();
    ctx.globalAlpha = t.alpha;
    ctx.fillStyle = t.color;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    t.x -= plane.vx*0.6;
    t.y += (Math.random() - 0.5) * 0.8 + 0.2;
    t.alpha -= 0.015;
    t.size *= 0.96;
    if(t.alpha <= 0.02) contrails.splice(i,1);
  }
}

/* Draw spiderweb / chute + drop image */
function drawParachutedImage(drop){
  if(!drop) return;
  const parachuteW = 140;
  const parachuteH = 90;
  const parachuteX = drop.x - parachuteW/2;
  const parachuteY = drop.y - (FALL_SIZE/2) - 78;

  // Render spiderweb PNG image directly without color tinting
  ctx.save();
  ctx.drawImage(parachuteImg, parachuteX, parachuteY, parachuteW, parachuteH);
  ctx.restore();

  // Web strings
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(drop.x - parachuteW*0.26, parachuteY + parachuteH*0.52);
  ctx.lineTo(drop.x - FALL_SIZE*0.22, drop.y - FALL_SIZE*0.28 + (drop.bounceOffset || 0));
  ctx.moveTo(drop.x + parachuteW*0.26, parachuteY + parachuteH*0.52);
  ctx.lineTo(drop.x + FALL_SIZE*0.22, drop.y - FALL_SIZE*0.28 + (drop.bounceOffset || 0));
  ctx.stroke();
  ctx.restore();

  // Dropped item
  ctx.save();
  ctx.shadowColor = 'rgba(0,255,102,0.4)';
  ctx.shadowBlur = 12;
  const yOffset = drop.bounceOffset || 0;
  ctx.drawImage(drop.img, drop.x - FALL_SIZE/2, drop.y - FALL_SIZE/2 + yOffset, FALL_SIZE, FALL_SIZE);
  ctx.restore();
}

/* -------- Main animation loop -------- */
function updateAndDraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Spooky Moon
  drawMoon();

  // Fog & mist
  for(const c of clouds) drawCloud(c);
  updateClouds();

  // Magic trail particles
  drawContrails();

  // Flying witch movement
  plane.x += plane.vx;
  if(plane.x > canvas.width - 160 || plane.x < 160) plane.vx *= -1;

  // Active Drop handling
  if(activeDrop){
    if(!activeDrop.stop){
      activeDrop.y += activeDrop.speed;
      activeDrop.x += Math.sin(activeDrop.y * 0.02) * 0.35;
      const grassTop = canvas.height - 90 - (FALL_SIZE/2) + 6;
      if(activeDrop.y >= grassTop){
        activeDrop.y = grassTop;
        activeDrop.stop = true;
        isRunning = false;
        activeDrop.bounce = { t:0, duration:28, amplitude:18 };
        playSound(dropAudio, 0.6);
      }
    } else if(activeDrop.bounce){
      const b = activeDrop.bounce;
      b.t++;
      const progress = b.t / b.duration;
      const damping = Math.exp(-4 * progress);
      const angle = Math.sin(progress * Math.PI * 2);
      activeDrop.bounceOffset = -Math.abs(angle) * b.amplitude * damping;
      if(b.t >= b.duration){
        activeDrop.bounce = null;
        activeDrop.bounceOffset = 0;
        if(!gameOver) nextBtn.style.display = 'block';
      }
    }
    drawParachutedImage(activeDrop);
  }

  // Draw Flying Witch
  ctx.save();
  ctx.shadowColor = 'rgba(255, 102, 0, 0.5)';
  ctx.shadowBlur = 12;
  if(plane.vx > 0){
    ctx.scale(-1,1);
    ctx.drawImage(planeImg, -plane.x - plane.w/2, plane.y - plane.h/2, plane.w, plane.h);
  } else {
    ctx.drawImage(planeImg, plane.x - plane.w/2, plane.y - plane.h/2, plane.w, plane.h);
  }
  ctx.restore();

  // Graveyard Ground
  drawGrassBase();

  // Magic fireworks
  drawFireworks();

  requestAnimationFrame(updateAndDraw);
}

/* -------- Score logic -------- */
function updateScoreUI(){ p1scoreSpan.textContent = score1; p2scoreSpan.textContent = score2; }

function pulseElement(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }

function clampAndAddScore(player){
  if(gameOver) return;
  if(player === 1){
    if(score1 < 100) score1 = Math.min(100, score1 + 10);
    updateScoreUI();
    pulseElement(p1Box);
    p1Box.style.boxShadow = `0 0 25px ${hexToRgba(PLAYER1_COLOR,0.8)}`;
    setTimeout(()=> p1Box.style.boxShadow = '0 0 15px rgba(255,102,0,0.4)', 520);
  } else {
    if(score2 < 100) score2 = Math.min(100, score2 + 10);
    updateScoreUI();
    pulseElement(p2Box);
    p2Box.style.boxShadow = `0 0 25px ${hexToRgba(PLAYER2_COLOR,0.8)}`;
    setTimeout(()=> p2Box.style.boxShadow = '0 0 15px rgba(0,255,102,0.4)', 520);
  }
  playSound(clickAudio, 0.3);

  if(score1 >= 100 || score2 >= 100){
    gameOver = true;
    const winner = score1 >= 100 ? 1 : 2;
    const winnerName = winner === 1 ? playerName1 : playerName2;
    const winnerColor = winner === 1 ? PLAYER1_COLOR : PLAYER2_COLOR;
    showWinnerBanner(`${winnerName} Wins!`, winnerColor);

    for(let i=0;i<12;i++){
      createFireworkBurst(Math.random()*canvas.width, Math.random()*canvas.height*0.45, 80 + Math.floor(Math.random()*120));
    }

    setTimeout(()=> {
      playAgainOverlay.style.display = 'flex';
      playAgainOverlay.setAttribute('aria-hidden', 'false');
    }, 5000);
  }
}

/* -------- Round control -------- */
function startRoundUnderPlane(resetScores = false){
  if(resetScores){
    score1 = 0; score2 = 0; updateScoreUI();
  }
  const pool = getActiveDropPool();
  if(pool.length === 0){
    pool.push(...defaultDropImgs);
  }
  const idx = Math.floor(Math.random() * pool.length);
  activeDrop = {
    img: pool[idx],
    x: plane.x,
    y: plane.y + plane.h/3,
    speed: 0.9 + Math.random()*0.6,
    stop: false,
    bounceOffset: 0,
    bounce: null
  };
  isRunning = true;
  gameOver = false;
  winnerBanner.style.display = 'none';
  fireworksParticles.length = 0;
  nextBtn.style.display = 'none';
  playSound(dropAudio, 0.6);
}

/* -------- UI binding -------- */
p1Box.addEventListener('click', ()=> clampAndAddScore(1));
p2Box.addEventListener('click', ()=> clampAndAddScore(2));

nextBtn.addEventListener('click', ()=> startRoundUnderPlane(false));

function showWinnerBanner(text, color){
  winnerBanner.style.display = 'block';
  winnerBanner.textContent = `🎃 ${text} 👻`;
  winnerBanner.style.background = `linear-gradient(120deg, #1f0833, ${color})`;
  winnerBanner.style.color = '#fff';
  winnerBanner.style.boxShadow = `0 0 30px ${hexToRgba(color,0.8)}`;
}

/* -------- Upload handling -------- */
async function handleFiles(fileList){
  clearUploadedImages();

  const files = Array.from(fileList).slice(0, MAX_UPLOADS);
  const invalid = files.filter(f => !ALLOWED_TYPES.includes(f.type));
  if(invalid.length > 0){
    alert("Please upload PNG or JPG images only. Some files were ignored.");
  }
  const validFiles = files.filter(f => ALLOWED_TYPES.includes(f.type));
  if(validFiles.length === 0){
    uploadInfo.textContent = "No valid PNG/JPG images selected — spooky default set will be used.";
    return;
  }

  for(const f of validFiles){
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.src = url;
    uploadedImgs.push({ img, url });
  }

  uploadInfo.textContent = `${uploadedImgs.length} custom spooky image(s) selected — they will be used for drops.`;
}

function clearUploadedImages(){
  for(const o of uploadedImgs){
    try { URL.revokeObjectURL(o.url); } catch(e){}
  }
  uploadedImgs = [];
  uploadInfo.textContent = "No custom images selected — game will use default set.";
}

fileInput.addEventListener('change', (e) => {
  const files = e.target.files;
  handleFiles(files);
});

/* -------- Start overlay handling + fullscreen + audio start -------- */
startBtn.addEventListener('click', async ()=> {
  const n1 = name1Input.value.trim();
  const n2 = name2Input.value.trim();
  playerName1 = n1.length ? n1 : 'Pumpkin 1';
  playerName2 = n2.length ? n2 : 'Ghost 2';

  p1nameSpan.textContent = playerName1;
  p2nameSpan.textContent = playerName2;

  score1 = 0; score2 = 0; updateScoreUI();

  // Start background spooky audio
  try {
    bgAudio.currentTime = 0;
    bgAudio.play().catch(e => console.warn("Background audio play error:", e));
  } catch(e){}

  try {
    if(document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    } else if(document.documentElement.webkitRequestFullscreen) {
      await document.documentElement.webkitRequestFullscreen();
    } else if(document.documentElement.msRequestFullscreen) {
      await document.documentElement.msRequestFullscreen();
    }
  } catch(e){
    console.warn("Fullscreen request error:", e);
  }

  startOverlay.style.display = 'none';
  startOverlay.setAttribute('aria-hidden','true');

  playSound(clickAudio, 0.12);
  startRoundUnderPlane(true);
});

/* -------- Play Again overlay handling -------- */
playYes.addEventListener('click', ()=> {
  playAgainOverlay.style.display = 'none';
  playAgainOverlay.setAttribute('aria-hidden','true');
  score1 = 0; score2 = 0; updateScoreUI();
  startRoundUnderPlane(true);
});

playNo.addEventListener('click', ()=> {
  playAgainOverlay.style.display = 'none';
  playAgainOverlay.setAttribute('aria-hidden','true');
  startOverlay.style.display = 'flex';
  startOverlay.setAttribute('aria-hidden','false');
});

window.addEventListener('beforeunload', () => {
  clearUploadedImages();
});

/* -------- Init & start animation -------- */
updateScoreUI();
updateAndDraw();

</script>
